<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penge po barya</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0052cc 0%, #002266 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            padding: 30px 20px;
            max-width: 380px;
            width: 100%;
        }

            .card h1 {
                color: #0052cc;
                font-size: 28px;
                font-weight: 700;
                margin-bottom: 8px;
            }

            .card p {
                color: #666666;
                font-size: 15px;
                margin-bottom: 20px;
            }

        .qr-container {
            background: #f4f7fa;
            border-radius: 12px;
            padding: 15px;
            display: inline-block;
            margin-bottom: 20px;
            border: 2px dashed #0052cc;
        }

            .qr-container img {
                width: 100%;
                max-width: 280px;
                height: auto;
                border-radius: 8px;
                display: block;
            }

        .account-name {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>yahh 150 lang yahh</h1>
        <p>pambili lang pod</p>

        <div class="qr-container">
            <!-- Replace 'qr-code.jpg' with the actual file path or URL of your QR code image -->
            <img src="qr-code.jpg.jpg" alt="InstaPay QR Code">
        </div>

        <div class="account-name">JA*E M.</div>
    </div>

</body>
</html>
